name: SSH Integration Tests

# SSH integration tests require a real SSH server. This workflow:
# 1. Starts an SSH server in the CI environment
# 2. Generates SSH keys for authentication
# 3. Runs the SSH integration test suite
#
# The tests are designed to be self-skipping when no SSH server is available,
# so this workflow is safe to run on any platform.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  ssh-integration:
    runs-on: ubuntu-latest
    name: SSH integration tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build lib
        run: pnpm run build:lib:host

      # Start SSH server and generate keys for testing
      - name: Setup SSH server
        run: |
          set -euo pipefail

          # Install and start SSH server
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server > /dev/null 2>&1

          # Create test user
          sudo useradd -m -s /bin/bash testuser || true
          echo "testuser:testpassword" | sudo chpasswd

          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@ci"

          # Configure authorized_keys
          mkdir -p /home/testuser/.ssh
          cp /tmp/test_key.pub /home/testuser/.ssh/authorized_keys
          chmod 700 /home/testuser/.ssh
          chmod 600 /home/testuser/.ssh/authorized_keys
          chown -R testuser:testuser /home/testuser/.ssh

          # Start SSH server
          sudo service ssh start

          # Wait for SSH to be ready
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/test_key -p 2222 testuser@localhost echo "ready" 2>/dev/null; then
              echo "SSH server is ready"
              break
            fi
            sleep 1
          done

          # Configure SSH to listen on port 2222 for testing
          sudo sed -i 's/^Port 22/Port 2222/' /etc/ssh/sshd_config
          sudo service ssh restart

          echo "DEEPSEEK_SSH_TEST_HOST=localhost" >> $GITHUB_ENV
          echo "DEEPSEEK_SSH_TEST_USER=testuser" >> $GITHUB_ENV
          echo "DEEPSEEK_SSH_TEST_KEY=/tmp/test_key" >> $GITHUB_ENV
          echo "DEEPSEEK_SSH_TEST_PORT=2222" >> $GITHUB_ENV

      - name: Run SSH integration tests
        env:
          DEEPSEEK_SSH_TEST_HOST: localhost
          DEEPSEEK_SSH_TEST_USER: testuser
          DEEPSEEK_SSH_TEST_KEY: /tmp/test_key
          DEEPSEEK_SSH_TEST_PORT: 2222
        run: |
          npx vitest run packages/ssh/ssh-native/tests/integration.spec.ts --reporter=verbose
