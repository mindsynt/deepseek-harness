# DSH Web GUI — Nginx 反向代理
# 安装：ln -s /home/jinchan/deepseek-harness/dsh.nginx.conf /etc/nginx/sites-enabled/dsh
# 测试：nginx -t
# 重载：nginx -s reload

# 将 <your-frp-domain> 替换为实际域名
server {
    listen 80;
    server_name <your-frp-domain>;

    # 客户端最大请求体（模型可传图片，设大一些）
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # 通用代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接（Remote event stream）
        proxy_buffering off;
        proxy_read_timeout 86400s;

        # WebSocket 升级（Remote stream mux /api/remote.mux）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}