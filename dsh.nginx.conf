# DSH Web GUI — Nginx 反向代理（FRP 穿透）
# 安装：ln -s /home/jinchan/deepseek-harness/dsh.nginx.conf /etc/nginx/sites-enabled/dsh
# 测试：nginx -t
# 重载：nginx -s reload

# 将 <your-frp-domain> 替换为实际域名
server {
    listen 80;
    server_name <your-frp-domain>;

    # 客户端最大请求体（模型可传图片）
    client_max_body_size 300m;

    location / {
        # 改写 Host 为回环地址，让 DSH 的 /api 信任围栏放行
        proxy_set_header Host 127.0.0.1:3080;

        # 清空浏览器标记头，避免跨域拦截
        proxy_set_header Origin "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header Sec-Fetch-Mode "";
        proxy_set_header Sec-Fetch-Dest "";

        # 清空客户端 IP 头
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:3080;
    }
}